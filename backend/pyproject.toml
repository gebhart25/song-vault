[project]
name = "songvault"
version = "0.1.0"
description = "Self-hosted organizer for song-idea recordings"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "argon2-cffi>=23.1",
    "tzdata>=2025.2",
]

[project.scripts]
songvault = "songvault.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/songvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
